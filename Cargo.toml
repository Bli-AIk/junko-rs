[package]
name = "junko-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.0"


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = 1
incremental = true

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
debug = 0
