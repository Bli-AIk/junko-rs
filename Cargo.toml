[package]
name = "junko-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.17.2"

[dependencies.bevy-inspector-egui]
version = "0.35.0"
optional = true

[dependencies.iyes_perf_ui]
git = "https://github.com/Bli-AIk/iyes_perf_ui"
branch = "bevy-0.17"
optional = true

[dependencies.bevy_tween]
version = "0.10.0"
optional = true

[features]
default = []
debug = ["dep:bevy-inspector-egui", "dep:iyes_perf_ui", "dep:bevy_tween"]


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = 1
incremental = true

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
debug = 0
